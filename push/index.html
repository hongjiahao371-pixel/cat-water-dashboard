<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>推送与 OpenClaw 集成</title>
  <script src="/auth.js"></script>
  <style>
    :root{--bg:#1d1a15;--card:#28241c;--line:rgba(200,180,150,.10);--text:#f5efe0;--muted:#9b8c7d;--brand:#d4924a;--ok:#7aaa54;--err:#d4735e;--radius:22px;--shadow:0 22px 56px rgba(0,0,0,.34);--font-heading:Georgia,"Noto Serif SC","STSong",serif;--font-body:Inter,"PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#1d1a15,#1a1712);font-family:var(--font-body);color:var(--text);-webkit-font-smoothing:antialiased}body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:256px 256px}.wrap{width:min(1100px,calc(100vw - 32px));margin:24px auto;position:relative;z-index:1}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.back{color:var(--text);text-decoration:none;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(245,239,224,.04);transition:all .2s}.back:hover{background:rgba(245,239,224,.08)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.wide{grid-column:1/-1}.inner{padding:20px}h3{font-family:var(--font-heading)}.field{display:grid;gap:8px;margin-bottom:14px}.field label{font-size:13px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(245,239,224,.08);background:rgba(245,239,224,.04);color:var(--text);font-family:var(--font-body)}.check{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid rgba(245,239,224,.05)}.check input{width:18px;height:18px;accent-color:var(--ok)}.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:600;background:var(--brand);color:#fff;cursor:pointer;font-family:var(--font-body);transition:all .2s}.btn:hover{opacity:.9}.btn.secondary{background:rgba(245,239,224,.05);border:1px solid rgba(245,239,224,.08)}.actions{display:flex;gap:12px;flex-wrap:wrap}.note{margin-top:12px;padding:14px 16px;border-radius:16px;background:rgba(212,146,74,.08);border:1px solid rgba(212,146,74,.14);color:#d5cfc4;font-size:13px;line-height:1.6}.status{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(122,170,84,.08);border:1px solid rgba(122,170,84,.16);font-size:13px;color:#c8e8d0}.status.warn{background:rgba(212,115,94,.09);border-color:rgba(212,115,94,.2);color:#f0b8ad}.history{display:grid;gap:10px}.history-item{display:grid;grid-template-columns:170px 1fr auto;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(245,239,224,.035);font-size:13px}.history-item .ok{color:#c8e8d0}.history-item .err{color:#f0b8ad}@media(max-width:900px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.history-item{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="back" href="/">← 返回面板</a>
      <div style="font-size:28px;font-weight:700;font-family:var(--font-heading)">推送与 OpenClaw 集成</div>
    </div>
    <div class="grid">
      <div class="card">
        <div class="inner">
          <h3 style="margin-top:0">OpenClaw Webhook</h3>
          <div class="field"><label>Webhook 地址</label><input id="openclawWebhook"></div>
          <div class="field"><label>默认推送类型</label><select id="pushMode"><option>日报 + 异常提醒</option><option>仅异常提醒</option><option>仅日报</option></select></div>
          <div class="field"><label>附加摘要模板</label><textarea id="summaryTemplate" rows="6"></textarea></div>
          <div class="actions">
            <button class="btn" id="saveWebhook">保存 OpenClaw 配置</button>
            <button class="btn secondary" id="testPush">发送测试推送</button>
          </div>
          <div class="note">支持通用 JSON Webhook；若填写飞书自定义机器人 Webhook，会自动转换成飞书文本消息格式。地址中的密钥保存后不会再次显示。</div>
          <div class="status" id="pushStatus">尚未加载配置</div>
        </div>
      </div>
      <div class="card">
        <div class="inner">
          <h3 style="margin-top:0">飞书与推送策略</h3>
          <div class="field"><label>飞书目标会话 / Chat ID</label><input id="feishuTarget"></div>
          <div class="field"><label>无饮水提醒阈值（小时）</label><input id="noDrinkHours" type="number" min="1" step="1"></div>
          <div class="field"><label>低于近 7 日均值阈值（%）</label><input id="lowCountPercent" type="number" min="1" step="1"></div>
          <div class="field"><label>日报发送时间</label><input id="dailyReportTime" type="time"></div>
          <div class="field"><label>未饮水提醒重复间隔（小时）</label><input id="alertCooldownHours" type="number" min="1" max="48" step="1"></div>
          <div class="field"><label>异常阈值说明</label><textarea id="strategyPreview" rows="5" readonly></textarea></div>
          <label class="check"><span>日报推送到飞书</span><input id="enableFeishuDaily" type="checkbox"></label>
          <label class="check"><span>长时间未饮水提醒</span><input id="enableFeishuAlert" type="checkbox"></label>
          <label class="check"><span>低饮水量预警</span><input id="enableLowIntakeAlert" type="checkbox"></label>
          <label class="check"><span>录像巡检新候选提醒</span><input id="enableReviewCandidateAlert" type="checkbox"></label>
          <div class="actions" style="margin-top:14px">
            <button class="btn" id="saveStrategy">保存飞书策略</button>
          </div>
        </div>
      </div>
      <div class="card wide">
        <div class="inner">
          <h3 style="margin-top:0">最近投递自检</h3>
          <div class="history" id="pushHistory"><div class="history-item">暂无投递记录</div></div>
          <div class="note">测试发送会使用当前保存的真实 Webhook，并记录 HTTP 或飞书业务层结果；不会显示 Webhook 密钥。</div>
        </div>
      </div>
    </div>
  </div>
<script>
function updateStrategyPreview(){
  strategyPreview.value = (noDrinkHours.value || 8) + ' 小时无饮水 → ' + (enableFeishuAlert.checked ? '发送提醒' : '不提醒') + '\n当日饮水次数低于近 7 日均值 ' + (lowCountPercent.value || 30) + '% → ' + (enableLowIntakeAlert.checked ? '发送预警' : '仅记录') + '\n录像巡检新候选 → ' + (enableReviewCandidateAlert.checked ? '立即提醒' : '仅进入审核队列') + '\n日报推送 → ' + (enableFeishuDaily.checked ? '开启' : '关闭');
}
function fillForm(data){
  openclawWebhook.value = data.openclawWebhook || '';
  pushMode.value = data.pushMode || '日报 + 异常提醒';
  summaryTemplate.value = data.summaryTemplate || '';
  feishuTarget.value = data.feishuTarget || '';
  noDrinkHours.value = data.noDrinkHours ?? 8;
  lowCountPercent.value = data.lowCountPercent ?? 30;
  dailyReportTime.value = data.dailyReportTime || '21:30';
  alertCooldownHours.value = data.alertCooldownHours ?? 6;
  enableFeishuDaily.checked = Boolean(data.enableFeishuDaily);
  enableFeishuAlert.checked = Boolean(data.enableFeishuAlert);
  enableLowIntakeAlert.checked = Boolean(data.enableLowIntakeAlert);
  enableReviewCandidateAlert.checked = data.enableReviewCandidateAlert !== false;
  updateStrategyPreview();
  pushStatus.textContent = '当前：' + pushMode.value + ' · Webhook ' + (data.webhookConfigured ? '已配置' : '未配置') + ' · 日报 ' + dailyReportTime.value;
  pushStatus.classList.toggle('warn', !data.webhookConfigured);
}
function buildPayload(){
  return {
    openclawWebhook: openclawWebhook.value.trim(),
    pushMode: pushMode.value,
    summaryTemplate: summaryTemplate.value,
    feishuTarget: feishuTarget.value.trim(),
    noDrinkHours: Number(noDrinkHours.value || 8),
    lowCountPercent: Number(lowCountPercent.value || 30),
    dailyReportTime: dailyReportTime.value || '21:30',
    alertCooldownHours: Number(alertCooldownHours.value || 6),
    enableFeishuDaily: enableFeishuDaily.checked,
    enableFeishuAlert: enableFeishuAlert.checked,
    enableLowIntakeAlert: enableLowIntakeAlert.checked,
    enableReviewCandidateAlert: enableReviewCandidateAlert.checked
  };
}
async function load(){
  const data = await fetch('/api/push-settings').then(r => r.json());
  fillForm(data);
  try{
    const status = await fetch('/api/notification-status',{cache:'no-store'}).then(r => r.json());
    const text = status.configured ? ('通知服务：' + (status.phase || '运行中') + ' · 待重试 ' + (status.pending || 0)) : '通知服务已运行，等待填写真实 Webhook';
    pushStatus.textContent += ' · ' + text;
  }catch(_){ pushStatus.textContent += ' · 通知服务状态暂不可用'; }
  try{
    const history = await fetch('/api/push-log',{cache:'no-store'}).then(r => r.json());
    const items = (history.items || []).slice(0, 5);
    pushHistory.innerHTML = items.length ? items.map(item => '<div class="history-item"><span>' + escapeHtml(item.created_at || '--') + '</span><span>' + escapeHtml(item.title || item.type || '推送') + (item.error ? ' · ' + escapeHtml(item.error) : '') + '</span><strong class="' + (item.ok ? 'ok' : 'err') + '">' + (item.ok ? '送达' : '失败') + (item.status ? ' · HTTP ' + item.status : '') + '</strong></div>').join('') : '<div class="history-item">暂无投递记录</div>';
  }catch(_){ pushHistory.innerHTML = '<div class="history-item"><span class="err">投递记录暂不可用</span></div>'; }
}
function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}
async function save(showAlert=true){
  const res = await fetch('/api/push-settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buildPayload()) });
  const data = await res.json();
  if(!data.ok){ alert(data.error || '保存失败'); return; }
  fillForm(data.push);
  if(showAlert) alert('推送配置已保存');
  return true;
}
async function testPush(){
  const saved = await save(false);
  if(!saved) return;
  const payload = buildPayload();
  const res = await fetch('/api/integrations/openclaw/push', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ type:'test_push', title:'猫咪饮水监控测试推送', target: payload.feishuTarget, mode: payload.pushMode, content:{ drink_count: 6, estimated_total_ml: 38, last_drink_time: '15:21' } }) });
  const data = await res.json();
  if(!res.ok){ alert(data.error || '测试推送失败'); await load(); return; }
  alert(data.message || '测试推送已发送');
  await load();
}
[noDrinkHours, lowCountPercent, dailyReportTime, alertCooldownHours, enableFeishuDaily, enableFeishuAlert, enableLowIntakeAlert, enableReviewCandidateAlert].forEach(el => el.addEventListener('input', updateStrategyPreview));
document.getElementById('saveWebhook').onclick = save;
document.getElementById('saveStrategy').onclick = save;
document.getElementById('testPush').onclick = testPush;
load();
</script>
</body>
</html>
